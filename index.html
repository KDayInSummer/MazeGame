<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷宫游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>迷宫游戏</h1>
        </header>
        
        <div class="controls">
            <select id="difficulty">
                <option value="easy">简单</option>
                <option value="medium">中等</option>
                <option value="hard">困难</option>
            </select>
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn">暂停</button>
            <button id="hintBtn">提示</button>
            <button id="resetBtn">重新开始</button>
        </div>
        
        <div class="status-bar">
            <span class="status-item">时间: <span id="timer">00:00</span></span>
            <span class="status-item">得分: <span id="score">0</span></span>
            <span class="status-item">状态: <span id="gameStatus">准备开始</span></span>
        </div>
        
        <canvas id="mazeCanvas"></canvas>
        
        <div class="instructions">
            <p>操作说明: 使用方向键或WASD控制移动 | 空格键暂停/继续 | R键重新开始</p>
        </div>
        
        <div id="winModal" class="modal">
            <div class="modal-content">
                <h2>🎉 恭喜通关！</h2>
                <p>用时: <span id="winTime">00:00</span></p>
                <p>得分: <span id="winScore">0</span></p>
                <button id="playAgainBtn">再玩一次</button>
            </div>
        </div>
    </div>
    
    <script src="js/MazeGenerator.js"></script>
    <script src="js/PathFinder.js"></script>
    <script src="js/Renderer.js"></script>
    <script src="js/Timer.js"></script>
    <script src="js/GameController.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
